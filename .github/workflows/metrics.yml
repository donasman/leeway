# Records the launch metrics once a day into data/*.csv on the metrics branch:
# traffic (views, clones), top referrers and paths, release downloads and
# stars. GitHub keeps traffic for 14 days only, so a missed day is filled in
# by the next run. Collection is done by .github/scripts/collect_metrics.py;
# docs/metrics.md lists the columns and the TRAFFIC_TOKEN secret it needs.
name: metrics

on:
  schedule:
    - cron: '0 0 * * *'  # 00:00 UTC = 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The metrics branch holds only data/, with no history shared with the
      # code. The first run creates it.
      - name: Check out the metrics branch
        run: |
          set -euo pipefail
          status=0
          git ls-remote --exit-code --heads origin metrics >/dev/null || status=$?
          if [ "$status" = 0 ]; then
            git fetch --depth=1 origin metrics
            git worktree add metrics-data FETCH_HEAD
            git -C metrics-data checkout -B metrics
          elif [ "$status" = 2 ]; then  # 2: no such ref; anything else is an error
            echo "metrics branch not found; creating it"
            git worktree add --detach metrics-data
            git -C metrics-data checkout --orphan metrics
            git -C metrics-data rm -rf --quiet .
          else
            echo "git ls-remote failed with $status" >&2
            exit 1
          fi

      - name: Collect
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/collect_metrics.py metrics-data/data

      - name: Commit and push
        working-directory: metrics-data
        run: |
          set -euo pipefail
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m "metrics: $(date -u +%F)"
          git push origin metrics
