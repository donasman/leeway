# Builds the Leeway helper (helper/) from source and attaches it to a GitHub
# Release, so the popup's "Get the helper" link
# (releases/latest/download/leeway-helper.exe) always points at a build
# anyone can trace back to this repository.
#
# Push a tag such as v0.6.0 to build and attach. Run it by hand
# (workflow_dispatch) to build and test without publishing; the exe is then
# kept as a workflow artifact.
name: helper release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod

      - name: Test
        working-directory: helper
        run: |
          go vet ./...
          go test ./...

      - name: Build the Windows helper
        working-directory: helper
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/leeway-helper.exe .
          cd dist && sha256sum leeway-helper.exe > leeway-helper.exe.sha256 && cat leeway-helper.exe.sha256

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: leeway-helper
          path: helper/dist/

      # Every release carries the helper, so "latest" always has it.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes "leeway-helper.exe is built from helper/ by this workflow. Check it against leeway-helper.exe.sha256. It is not code-signed yet, so Windows may warn the first time it runs."
          fi
          gh release upload "$GITHUB_REF_NAME" helper/dist/leeway-helper.exe helper/dist/leeway-helper.exe.sha256 --clobber
